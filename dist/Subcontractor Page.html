<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subcontractor Dashboard</title>
  <!-- Toastify CSS & JS -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <style>
/* General Styles */
body {
    font-family: "Poppins", sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
  padding-bottom: 92px;
}

body.modal-open {
  overflow: hidden;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: 20px auto;
}

/* Header */
header.header {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04)),
      linear-gradient(135deg, rgba(37, 99, 235, 0.94) 0%, rgba(14, 165, 233, 0.9) 55%, rgba(15, 118, 110, 0.88) 100%);
  color: #fff;
  text-align: left;
  padding: 18px 24px;
  font-size: 26px;
  font-weight: 700;
  border-radius: 0 0 18px 18px;
  box-shadow: 0 4px 16px rgba(30, 64, 175, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

header.header h1 {
  margin: 0;
  font-size: 1.6em;
  letter-spacing: 1px;
  font-weight: 700;
}

/* Section Styling */
section {
    margin-top: 20px;
}

h2 {
    color: #0f4c75;
    font-size: 22px;
    border-bottom: 2px solid #0f4c75;
    padding-bottom: 10px;
    margin-bottom: 20px;
}

.scroll-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 10px;
    overflow-x: unset;
    overflow-y: unset;
    scroll-snap-type: none;
}

.scroll-container.is-loading {
  gap: 12px;
}

.section-loader {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 84px;
  padding: 16px 18px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(239, 246, 255, 0.92));
  border: 1px solid #dbeafe;
  box-shadow: 0 10px 26px rgba(37, 99, 235, 0.08);
}

.section-loader-spinner {
  width: 28px;
  height: 28px;
  border: 3px solid #dbeafe;
  border-top-color: #0ea5e9;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex: 0 0 auto;
}

.section-loader-text {
  color: #0f4c75;
  font-size: 14px;
  font-weight: 600;
}

/* Hide scrollbar for Chrome, Safari, Edge */
.scroll-container::-webkit-scrollbar {
    display: none;
}

/* Project & Task Cards */
.project-card,
.item-card {
    background-color: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 100%;           /* Full width */
    min-width: 0;           /* Remove min-width for horizontal scroll */
    flex-shrink: 1;         /* Allow shrinking */
    margin: 0 auto;         /* Center if container is smaller */
    transition: transform 0.2s ease-in-out, box-shadow 0.3s;
}

.project-card:hover,
.item-card:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
}

.project-card h3,
.item-card h4 {
    color: #1b262c;
    margin-bottom: 10px;
}

.project-card p,
.item-card p {
    font-size: 14px;
    color: #555;
    margin: 5px 0;
}

/* Buttons */
button,
.btn,
.logout-button {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04)),
      linear-gradient(135deg, rgba(37, 99, 235, 0.94) 0%, rgba(14, 165, 233, 0.9) 55%, rgba(15, 118, 110, 0.88) 100%);
  color: #fff;
  border: none;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(30, 64, 175, 0.08);
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  margin: 0 4px;
  outline: none;
  letter-spacing: 0.5px;
  display: inline-block;
}

button:hover,
.btn:hover,
.logout-button:hover {
  background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
  box-shadow: 0 4px 16px rgba(30, 64, 175, 0.13);
  transform: translateY(-2px) scale(1.03);
}

/* Responsive Design */
@media (max-width: 768px) {
    .container {
        width: 95%;
    }

    header {
        font-size: 20px;
    }
}

@media (max-width: 768px) {
    .project-card,
    .item-card {
        width: 100%;
        margin: 0 0 12px 0;
    }
}
/* Status Color Styling */
.status-new {
    color: #ff0000; /* Blue */
    font-weight: bold;
}
.status-in-progress {
    color: #ffc107; /* Amber/Yellow */
    font-weight: bold;
}
.status-completed {
    color: #28a745; /* Green */
    font-weight: bold;
}

.status-rework {
      color: #dc2626;
      font-weight: bold;
    }

/* ✅ Modern Toastify Custom Styles */
    .toastify {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
    background-color: rgb(255, 255, 255);
    color: #333;
    width: auto;
    max-width: 420px; /* Default max width */
    min-width: 250px;
    position: relative;
    background: #f4f4f9;
}


/* ✅ Responsive for Mobile Screens */
@media (max-width: 480px) {
    .toastify {
        max-width: 90%; /* Adjust width for smaller screens */
        padding: 12px;
    }

    .toast-text {
        font-size: 13px; /* Reduce text size on small screens */
    }

    .toast-title {
        font-size: 14px;
    }

    .toast-icon {
        font-size: 18px;
    }
}

/* ✅ Left Status Indicator Bar */
.toastify::before {
    content: "";
    width: 8px;
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 10px 0 0 10px;
}

/* ✅ Success Theme */
.toastify-success::before {
    background: linear-gradient(to bottom, #34d399, #059669); /* Green gradient */
}

/* ✅ Error Theme */
.toastify-error::before {
    background: linear-gradient(to bottom, #ef4444, #b91c1c); /* Red gradient */
}

/* ✅ Toast Content Layout */
.toast-content {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    word-wrap: break-word; /* Allow long words to break */
    white-space: normal; /* Ensure text wraps correctly */
}

/* ✅ Icon Styling */
.toast-icon {
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ✅ Text Styling */
.toast-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1; /* Ensure text takes remaining space */
}

.toast-title {
    font-weight: bold;
    font-size: 15px;
}

.toast-message {
    font-size: 13px;
    color: #555;
}

.toast-close{
    color: #040404;
    margin-top: 65px;
    margin-left: -345px;

}

.toast-close:hover {
    background-color: #d40505;
}

/* ✅ Smooth Fade Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


#job-tabs {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #f4f4f9;
  padding-top: 8px;
  padding-bottom: 8px;
  /* Optional: add a subtle shadow for separation */
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.mobile-app-nav {
  display: none;
}

.mobile-app-shell {
  position: relative;
}

.tab-btn {
  background: #f1f5f9;
  color: #007bff;
  border: 1px solid #007bff;
  border-radius: 6px 6px 0 0;
  padding: 10px 22px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.2s, color 0.2s;
  margin-bottom: -2px;
}
.tab-btn.active {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04)),

  color: #fff;
  border-bottom: 2px solid #fff;
  z-index: 2;
}
.section-tab {
  display: none;
}
.section-tab.active {
  display: block;
}

.status-new {
    color: #007bff; /* Blue */
    font-weight: bold;
}

.tab-btn:hover {
  color: #fff;
  background: #007bff;
  border-color: #007bff;
}
@media (max-width: 768px) {

@media (max-width: 600px) {

.rework-badge {
    background-color: #dc2626;
    color: white;
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 0.9rem;
    font-weight: 600;
    display: inline-flex;

    gap: 6px;
    margin-left: 8px;
    box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3);
    animation: pulse 2s infinite;
}

.rework-badge i {
    font-size: 0.9rem;
}

.rework-badge .count {
    background: rgba(255, 255, 255, 0.2);
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 24px;
    text-align: center;
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
    }
}

.start-job-btn {
  background: linear-gradient(90deg, #ffc107 0%, #d7a203 100%);
  color: #fff;
  border: none;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(34, 197, 94, 0.18);
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  margin: 18px 0 0 0;
  letter-spacing: 1px;
  max-width: 320px;
  margin-left: auto;
  margin-right: auto;
  outline: none;
  position: relative;
}

.start-job-btn:hover {
  background: linear-gradient(90deg, #d7a203 0%, #ffc107 100%);
  box-shadow: 0 8px 24px rgba(34, 197, 94, 0.22);
  transform: translateY(-2px) scale(1.04);
}

.maintenance-card {
  border: 1px solid #dbeafe;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
  overflow: hidden;
}

.maintenance-card h3 {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.maintenance-project-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  background: #e0ecff;
  color: #1d4ed8;
  font-size: 12px;
  font-weight: 600;
}

.maintenance-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin: 12px 0;
}

.maintenance-meta p {
  margin: 0;
  background: #f8fafc;
  border-radius: 8px;
  padding: 10px 12px;
}

.maintenance-card > p {
  margin: 10px 0 0;
}

.maintenance-description {
  margin: 14px 0;
  padding: 12px 14px;
  border-radius: 10px;
  background: #f8fafc;
}

.maintenance-description ul {
  margin: 8px 0 0;
  padding-left: 20px;
}

.maintenance-description li {
  margin-bottom: 6px;
}

.maintenance-photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.maintenance-photo-block {
  padding: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: #fff;
}

.maintenance-photo-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  min-height: 48px;
}

.maintenance-photo-thumb {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #cbd5e1;
  background: #e2e8f0;
  cursor: pointer;
}

.maintenance-photo-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.maintenance-photo-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(15, 23, 42, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 10020;
}

.maintenance-photo-modal.is-open {
  display: flex;
}

.maintenance-photo-modal-dialog {
  position: relative;
  width: min(92vw, 900px);
  max-height: 92vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 14px;
  padding: 18px;
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(241, 245, 249, 0.96));
  box-shadow: 0 28px 60px rgba(15, 23, 42, 0.34);
}

.maintenance-photo-modal-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.maintenance-photo-modal-caption {
  color: #0f172a;
  font-size: 14px;
  font-weight: 600;
}

.maintenance-photo-modal-close,
.maintenance-photo-nav {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.maintenance-photo-modal-close {
  width: 42px;
  height: 42px;
  border-radius: 999px;
  margin: 0;
  font-size: 18px;
}

.maintenance-photo-stage {
  position: relative;
  min-height: min(68vh, 560px);
  border-radius: 18px;
  overflow: hidden;
  background: #dbeafe;
  touch-action: pan-y;
  user-select: none;
}

.maintenance-photo-stage img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: linear-gradient(180deg, #eff6ff, #dbeafe);
}

.maintenance-photo-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 999px;
  padding: 0;
  margin: 0;
  background: rgba(15, 23, 42, 0.72);
  color: #fff;
  box-shadow: none;
}

.maintenance-photo-nav:hover,
.maintenance-photo-nav:focus {
  background: rgba(15, 23, 42, 0.88);
}

.maintenance-photo-nav[disabled] {
  opacity: 0.45;
  cursor: default;
}

.maintenance-photo-nav.prev {
  left: 14px;
}

.maintenance-photo-nav.next {
  right: 14px;
}

.maintenance-photo-modal-hint {
  text-align: center;
  color: #475569;
  font-size: 12px;
  font-weight: 500;
}

.maintenance-placeholder {
  color: #64748b;
  font-size: 13px;
}

.maintenance-upload-label {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 600;
  cursor: pointer;
}

.maintenance-upload-label input {
  display: none;
}

.maintenance-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.maintenance-card.is-busy {
  opacity: 0.76;
}

.maintenance-status-btn[disabled],
.maintenance-upload-label.is-disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

.maintenance-status-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 190px;
}

.maintenance-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex: 0 0 auto;
}

.maintenance-photo-loader {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 72px;
}

.maintenance-photo-loader .maintenance-spinner {
  width: 28px;
  height: 28px;
  border-width: 4px;
  border-color: #f3f3f3;
  border-top-color: #0ea5e9;
}

.maintenance-status-btn {
  background: linear-gradient(90deg, #007bff 60%, #0ea5e9 100%);
}

  <script>
let maintenanceItemsCache = [];
let maintenancePhotoViewer = {
  photos: [],
  index: 0,
  itemId: "",
  type: "",
  touchStartX: null
};
const projectAssignmentBundles = new Map();
const projectCodeCache = new Map();

document.addEventListener("DOMContentLoaded", async () => {
    const vendorId = localStorage.getItem("vendorId");
    initializeMaintenancePhotoModal();

    // Fetch vendor name and display below dashboard title (left)
    if (vendorId) {
      try {
        const res = await fetch(`/api/vendors/${vendorId}?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          const name = data.name || data.vendorname || data.vendor?.name || data.vendor?.vendorname || "";
          if (name) {
            document.getElementById("vendor-name-label").textContent = `Welcome (${name})`;
          }
        }
      } catch (e) {}
    }

    if (!vendorId) {
        showToast("Vendor not authenticated.");
        window.location.href = "/sign-inpage.html";
        return;
    }

    await fetchAssignedProjects(vendorId);
});



function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function showLoader() {
  document.getElementById('loader').style.display = 'flex';
}

function hideLoader() {
  document.getElementById('loader').style.display = 'none';
}

function getDashboardContainerIds() {
  return [
    "new-jobs-container",
    "in-progress-container",
    "maintenance-container",
    "rework-container",
    "completed-container"
  ];
}

function renderSectionLoader(message = "Loading...") {
  return `
    <div class="section-loader" aria-live="polite">
      <div class="section-loader-spinner"></div>
      <div class="section-loader-text">${message}</div>
    </div>
  `;
}

function setContainerLoading(containerId, isLoading, message = "Loading...") {
  const container = document.getElementById(containerId);
  if (!container) return;

  container.classList.toggle("is-loading", isLoading);
  if (isLoading) {
    container.innerHTML = renderSectionLoader(message);
  }
}

function setDashboardLoadingState(isLoading) {
  const loaderMessages = {
    "new-jobs-container": "Loading new jobs...",
    "in-progress-container": "Loading active jobs...",
    "maintenance-container": "Loading maintenance items...",
    "rework-container": "Loading rework items...",
    "completed-container": "Loading completed jobs..."
  };

  getDashboardContainerIds().forEach(containerId => {
    setContainerLoading(containerId, isLoading, loaderMessages[containerId] || "Loading...");
  });
}

function renderDashboardLoadError() {
  getDashboardContainerIds().forEach(containerId => {
    const container = document.getElementById(containerId);
    if (!container) return;

    container.classList.remove("is-loading");
    container.innerHTML = "<p>Unable to load this section right now.</p>";
  });
}

function centerActiveTab(tabName) {
  const activeTab = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  const tabStrip = document.getElementById('job-tabs');
  if (!activeTab || !tabStrip) return;

  const stripRect = tabStrip.getBoundingClientRect();
  const tabRect = activeTab.getBoundingClientRect();
  const currentScroll = tabStrip.scrollLeft;
  const targetScroll = currentScroll + (tabRect.left - stripRect.left) - ((stripRect.width - tabRect.width) / 2);

  tabStrip.scrollTo({
    left: Math.max(0, targetScroll),
    behavior: 'smooth'
  });
}

function activateTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(button => {
    button.classList.toggle('active', button.getAttribute('data-tab') === tabName);
  });

  document.querySelectorAll('.section-tab').forEach(section => {
    section.classList.toggle('active', section.id === tabName);
  });

  document.querySelectorAll('.mobile-nav-btn').forEach(button => {
    button.classList.toggle('is-active', button.getAttribute('data-tab') === tabName);
  });

  centerActiveTab(tabName);
}

// Helper function to return a CSS class based on status
function getStatusClass(status) {
      if (status === "new") return "status-new";
      if (status === "in-progress") return "status-in-progress";
      if (status === "rework") return "status-rework";
      if (status === "completed") return "status-completed";
      return "";
    }

function formatProjectAddress(address = {}) {
  return [address.addressLine1, address.city, address.state]
    .filter(Boolean)
    .join(", ") || "N/A";
}

function formatMaintenanceDescription(desc) {
  if (!desc) return "<p>No description provided.</p>";

  const tasks = desc.split(/\s*\d+\.\s*\/\s*/).filter(task => task.trim() !== "");
  if (!tasks.length) {
    return `<p>${desc}</p>`;
  }

  return `<ul>${tasks.map(task => `<li>${task.trim()}</li>`).join("")}</ul>`;
}

function hasMaintenanceRequestId(item) {
  const maintenanceId = item?.maintenanceRequestId;
  return maintenanceId !== null && maintenanceId !== undefined && String(maintenanceId).trim() !== "";
}

function isOpenMaintenanceStatus(status) {
  const normalizedStatus = String(status || "new").trim().toLowerCase();
  return normalizedStatus !== "completed" && normalizedStatus !== "approved";
}

function normalizeObjectId(value) {
  if (!value) return "";
  if (typeof value === "string") return value;
  if (typeof value === "object" && value._id) return String(value._id);
  return String(value);
}

function buildMaintenanceLookupFromEstimates(estimates = []) {
  const lookup = new Map();

  estimates.forEach(estimate => {
    (estimate.lineItems || []).forEach(category => {
      (category.items || []).forEach(item => {
        if (!hasMaintenanceRequestId(item)) return;
        lookup.set(normalizeObjectId(item._id), {
          maintenanceRequestId: normalizeObjectId(item.maintenanceRequestId),
          estimateId: normalizeObjectId(estimate._id),
          itemStatus: item.status || "new",
          itemPhotos: item.photos || { before: [], after: [] }
        });
      });
    });
  });

  return lookup;
}

function getMaintenanceNextStatus(status) {
  const currentStatus = String(status || "new").toLowerCase();
  if (currentStatus === "new" || currentStatus === "rework") {
    return { status: "in-progress", label: "Mark as In Progress" };
  }
  if (currentStatus === "in-progress") {
    return { status: "completed", label: "Mark as Completed" };
  }
  if (currentStatus === "completed" || currentStatus === "approved") {
    return { status: "in-progress", label: "Mark as In Progress" };
  }
  return { status: "in-progress", label: "Mark as In Progress" };
}

function getMaintenanceActionLabel(status) {
  const currentStatus = String(status || "new").toLowerCase();
  if (currentStatus === "in-progress") return "Mark as Completed";
  if (currentStatus === "completed" || currentStatus === "approved") return "Mark as In Progress";
  return "Mark as In Progress";
}

function initializeMaintenancePhotoModal() {
  const modal = document.getElementById("maintenance-photo-modal");
  const closeButton = document.getElementById("maintenance-photo-close");
  const prevButton = document.getElementById("maintenance-photo-prev");
  const nextButton = document.getElementById("maintenance-photo-next");
  const stage = document.getElementById("maintenance-photo-stage");

  if (!modal || !closeButton || !prevButton || !nextButton || !stage) return;

  closeButton.addEventListener("click", closeMaintenancePhotoModal);
  prevButton.addEventListener("click", () => stepMaintenancePhoto(-1));
  nextButton.addEventListener("click", () => stepMaintenancePhoto(1));

  modal.addEventListener("click", event => {
    if (event.target === modal) {
      closeMaintenancePhotoModal();
    }
  });

  stage.addEventListener("touchstart", event => {
    maintenancePhotoViewer.touchStartX = event.changedTouches?.[0]?.clientX ?? null;
  }, { passive: true });

  stage.addEventListener("touchend", event => {
    const touchEndX = event.changedTouches?.[0]?.clientX ?? null;
    if (maintenancePhotoViewer.touchStartX === null || touchEndX === null) return;

    const deltaX = touchEndX - maintenancePhotoViewer.touchStartX;
    maintenancePhotoViewer.touchStartX = null;

    if (Math.abs(deltaX) < 40) return;
    stepMaintenancePhoto(deltaX < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener("keydown", event => {
    if (!modal.classList.contains("is-open")) return;
    if (event.key === "Escape") closeMaintenancePhotoModal();
    if (event.key === "ArrowLeft") stepMaintenancePhoto(-1);
    if (event.key === "ArrowRight") stepMaintenancePhoto(1);
  });
}

function openMaintenancePhoto(itemId, type, index) {
  const item = getMaintenanceItemById(itemId);
  const photos = Array.isArray(item?.photos?.[type]) ? item.photos[type] : [];
  if (!photos.length) return;

  maintenancePhotoViewer = {
    ...maintenancePhotoViewer,
    itemId: String(itemId),
    type: String(type || "before"),
    photos,
    index: Math.max(0, Math.min(Number(index) || 0, photos.length - 1)),
    touchStartX: null
  };

  const modal = document.getElementById("maintenance-photo-modal");
  if (!modal) return;

  modal.classList.add("is-open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  renderMaintenancePhotoModal();
}

function closeMaintenancePhotoModal() {
  const modal = document.getElementById("maintenance-photo-modal");
  if (!modal) return;

  modal.classList.remove("is-open");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
}

function stepMaintenancePhoto(direction) {
  const totalPhotos = maintenancePhotoViewer.photos.length;
  if (totalPhotos <= 1) return;

  const nextIndex = maintenancePhotoViewer.index + direction;
  if (nextIndex < 0 || nextIndex >= totalPhotos) return;

  maintenancePhotoViewer.index = nextIndex;
  renderMaintenancePhotoModal();
}

function renderMaintenancePhotoModal() {
  const image = document.getElementById("maintenance-photo-image");
  const caption = document.getElementById("maintenance-photo-caption");
  const prevButton = document.getElementById("maintenance-photo-prev");
  const nextButton = document.getElementById("maintenance-photo-next");
  const currentPhoto = maintenancePhotoViewer.photos[maintenancePhotoViewer.index];
  const totalPhotos = maintenancePhotoViewer.photos.length;

  if (!image || !caption || !prevButton || !nextButton || !currentPhoto) return;

  image.src = currentPhoto;
  image.alt = `${maintenancePhotoViewer.type} photo ${maintenancePhotoViewer.index + 1}`;
  caption.textContent = `${capitalizeMaintenancePhotoType(maintenancePhotoViewer.type)} photo ${maintenancePhotoViewer.index + 1} of ${totalPhotos}`;
  prevButton.disabled = maintenancePhotoViewer.index === 0;
  nextButton.disabled = maintenancePhotoViewer.index === totalPhotos - 1;
}

function capitalizeMaintenancePhotoType(type) {
  const value = String(type || "photo");
  return value.charAt(0).toUpperCase() + value.slice(1);
}

function mergeUniquePhotoUrls(existingPhotos = [], newPhotos = []) {
  const merged = Array.isArray(existingPhotos) ? [...existingPhotos] : [];

  newPhotos.forEach(photoUrl => {
    if (photoUrl && !merged.includes(photoUrl)) {
      merged.push(photoUrl);
    }
  });

  return merged;
}

async function fetchProjectAssignmentBundle(vendorId, projectId, options = {}) {
  const projectKey = String(projectId || "");
  const shouldForce = options.force === true;
  if (!vendorId || !projectKey) return null;

  if (!shouldForce && projectAssignmentBundles.has(projectKey)) {
    return projectAssignmentBundles.get(projectKey);
  }

  const [assignedResponse, estimatesResponse] = await Promise.all([
    fetch(`/api/vendors/${vendorId}/assigned-items/${projectKey}?t=${Date.now()}`),
    fetch(`/api/estimates?projectId=${projectKey}&t=${Date.now()}`)
  ]);

  if (!assignedResponse.ok) {
    throw new Error(`Failed to fetch project items for ${projectKey}`);
  }

  if (!estimatesResponse.ok) {
    throw new Error(`Failed to fetch estimates for ${projectKey}`);
  }

  const assignedData = await assignedResponse.json();
  const estimatesData = await estimatesResponse.json();
  const estimates = estimatesData.estimates || [];
  const assignedItems = assignedData.items || [];
  const estimateIds = new Set(estimates.map(estimate => normalizeObjectId(estimate._id)).filter(Boolean));
  const bundle = {
    assignedItems,
    estimates,
    maintenanceLookup: buildMaintenanceLookupFromEstimates(estimates),
    hasAssignedEstimate: assignedItems.some(item => {
      const estimateId = normalizeObjectId(item.estimateId);
      return estimateId && estimateIds.has(estimateId);
    })
  };

  projectAssignmentBundles.set(projectKey, bundle);
  return bundle;
}

async function fetchProjectCode(projectId) {
  const projectKey = String(projectId || "");
  if (!projectKey) return "N/A";

  if (projectCodeCache.has(projectKey)) {
    return projectCodeCache.get(projectKey);
  }

  try {
    const res = await fetch(`/api/details/projects/${projectKey}`);
    if (!res.ok) {
      projectCodeCache.set(projectKey, "N/A");
      return "N/A";
    }

    const data = await res.json();
    const projectCode = data.project?.code || "N/A";
    projectCodeCache.set(projectKey, projectCode);
    return projectCode;
  } catch (error) {
    projectCodeCache.set(projectKey, "N/A");

}

function updateCachedAssignedItem(itemId, updater) {
  for (const bundle of projectAssignmentBundles.values()) {
    const assignedItem = (bundle.assignedItems || []).find(entry => String(entry.itemId) === String(itemId));
    if (assignedItem) {
      updater(assignedItem);

    }
  }
}

function setMaintenanceItemBusy(itemId, busy, label = "") {
  const card = document.getElementById(`maintenance-card-${itemId}`);
  const button = document.getElementById(`maintenance-status-btn-${itemId}`);
  const beforeInput = document.getElementById(`maintenance-before-input-${itemId}`);
  const afterInput = document.getElementById(`maintenance-after-input-${itemId}`);
  const beforeLabel = document.getElementById(`maintenance-before-label-${itemId}`);
  const afterLabel = document.getElementById(`maintenance-after-label-${itemId}`);

  if (card) {
    card.classList.toggle("is-busy", busy);
  }

  if (button) {
    if (busy) {
      button.dataset.previousLabel = button.textContent.trim();
      button.innerHTML = `<span class="maintenance-spinner"></span><span>${label || "Updating..."}</span>`;
      button.disabled = true;
    } else {
      const item = getMaintenanceItemById(itemId);
      const nextLabel = item ? getMaintenanceActionLabel(item.status) : (button.dataset.previousLabel || "Update");
      button.textContent = nextLabel;
      button.disabled = false;
      delete button.dataset.previousLabel;
    }
  }

  [beforeInput, afterInput].forEach(input => {
    if (input) input.disabled = busy;
  });
  [beforeLabel, afterLabel].forEach(uploadLabel => {
    if (uploadLabel) uploadLabel.classList.toggle("is-disabled", busy);
  });
}

function setMaintenancePhotoBusy(itemId, type, busy) {
  const photoContainer = document.getElementById(`maintenance-${type}-${itemId}`);
  const uploadInput = document.getElementById(`maintenance-${type}-input-${itemId}`);
  const uploadLabel = document.getElementById(`maintenance-${type}-label-${itemId}`);

  if (uploadInput) uploadInput.disabled = busy;
  if (uploadLabel) uploadLabel.classList.toggle("is-disabled", busy);

  if (photoContainer && busy) {
    photoContainer.innerHTML = `
      <div class="maintenance-photo-loader">
        <div class="maintenance-spinner"></div>
      </div>
    `;
  }
}

function removeMaintenanceItem(itemId) {
  maintenanceItemsCache = maintenanceItemsCache.filter(item => String(item.itemId) !== String(itemId));
  renderMaintenanceAssignments(maintenanceItemsCache);
  updateMaintenanceTabCount();
}

function updateMaintenanceCardStatus(itemId, status) {
  const statusElement = document.getElementById(`maintenance-status-${itemId}`);
  if (statusElement) {
    statusElement.className = getStatusClass(status);
    statusElement.textContent = status;
  }

  const button = document.getElementById(`maintenance-status-btn-${itemId}`);
  if (button) {
    button.textContent = getMaintenanceActionLabel(status);

    delete button.dataset.previousLabel;
  }
}

function applyMaintenancePhotoUpdate(itemId, type, newPhotoUrls) {
  const cachedItem = getMaintenanceItemById(itemId);
  if (!cachedItem) return;

  const existingPhotos = cachedItem.photos?.[type] || [];
  const mergedPhotos = mergeUniquePhotoUrls(existingPhotos, newPhotoUrls);
  cachedItem.photos = {
    ...(cachedItem.photos || {}),
    [type]: mergedPhotos
  };

  updateCachedAssignedItem(itemId, assignedItem => {
    assignedItem.photos = {
      ...(assignedItem.photos || {}),
      [type]: mergedPhotos
    };
  });

  const photoContainer = document.getElementById(`maintenance-${type}-${itemId}`);
  if (photoContainer) {
    photoContainer.innerHTML = generateMaintenancePhotoList(mergedPhotos, itemId, type);
  }

  if (maintenancePhotoViewer.itemId === String(itemId) && maintenancePhotoViewer.type === type) {
    maintenancePhotoViewer.photos = mergedPhotos;
    maintenancePhotoViewer.index = Math.min(maintenancePhotoViewer.index, Math.max(mergedPhotos.length - 1, 0));
    renderMaintenancePhotoModal();
  }
}

function updateMaintenanceItemStatusLocally(itemId, status) {
  const item = getMaintenanceItemById(itemId);
  if (!item) return;
  item.status = status;
  updateCachedAssignedItem(itemId, assignedItem => {
    assignedItem.status = status;
  });

  if (!isOpenMaintenanceStatus(status)) {
    removeMaintenanceItem(itemId);
    return;
  }

  updateMaintenanceCardStatus(itemId, status);
}

function generateMaintenancePhotoList(photos, itemId, type) {
  if (!Array.isArray(photos) || photos.length === 0) {
    return `<p class="maintenance-placeholder">No photos uploaded.</p>`;

  return photos.map((photo, index) => `
    <button type="button" class="maintenance-photo-thumb" onclick="openMaintenancePhoto('${itemId}', '${type}', ${index})">
      <img src="${photo}" alt="${type} photo for item ${itemId}" loading="lazy" decoding="async" fetchpriority="low">
    </button>
  `).join("");
}

async function fetchMaintenanceAssignments(vendorId, projectGroups) {
  const container = document.getElementById("maintenance-container");
  if (!container) return;

  if (!Array.isArray(projectGroups) || projectGroups.length === 0) {
    maintenanceItemsCache = [];
    renderMaintenanceAssignments([]);
    return;
  }

  const uniqueProjects = [];
  const seenProjectIds = new Set();
  projectGroups.forEach(entry => {
    const projectId = entry?.projectId?._id ? String(entry.projectId._id) : "";
    if (!projectId || seenProjectIds.has(projectId)) return;
    seenProjectIds.add(projectId);
    uniqueProjects.push(entry);
  });

  const maintenanceGroups = await Promise.all(uniqueProjects.map(async (entry) => {
    const projectId = String(entry.projectId._id);
    try {
      const bundle = await fetchProjectAssignmentBundle(vendorId, projectId);
      if (!bundle) return [];

      return (bundle.assignedItems || [])
        .map(item => {
          const itemId = normalizeObjectId(item.itemId);
          const matchedMaintenanceItem = bundle.maintenanceLookup.get(itemId);
          if (!matchedMaintenanceItem && !hasMaintenanceRequestId(item)) return null;

          return {
            ...item,
            itemId,
            estimateId: normalizeObjectId(item.estimateId) || matchedMaintenanceItem?.estimateId || "",
            maintenanceRequestId: normalizeObjectId(item.maintenanceRequestId) || matchedMaintenanceItem?.maintenanceRequestId || "",
            status: item.status || matchedMaintenanceItem?.itemStatus || "new",
            photos: item.photos || matchedMaintenanceItem?.itemPhotos || { before: [], after: [] },
            projectName: entry.projectId.name || "Unnamed Project",
            projectAddress: formatProjectAddress(entry.projectId.address || {})
          };
        })
        .filter(Boolean)
        .filter(item => hasMaintenanceRequestId(item))
        .filter(item => isOpenMaintenanceStatus(item.status));
    } catch (error) {
      console.error("Error fetching maintenance assignments:", error);
      return [];
    }
  }));

  maintenanceItemsCache = maintenanceGroups
    .flat()
    .sort((left, right) => String(left.projectName || "").localeCompare(String(right.projectName || "")));

  renderMaintenanceAssignments(maintenanceItemsCache);
}

async function toggleMaintenanceItemStatus(itemId, currentStatus) {
  const vendorId = localStorage.getItem("vendorId");
  if (!vendorId) {
    showToast("Vendor not authenticated.");
    return;
  }

  const nextStatus = getMaintenanceNextStatus(currentStatus).status;
  let removedFromView = false;

  setMaintenanceItemBusy(itemId, true, nextStatus === "completed" ? "Completing..." : "Updating...");
  try {
    const response = await fetch(`/api/vendors/${vendorId}/update-item-status`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ itemId, status: nextStatus })
    });

    if (!response.ok) throw new Error("Failed to update maintenance item status.");

    await syncMaintenanceEstimateItemStatus(itemId, nextStatus);

    showToast(`Maintenance item updated to ${nextStatus}.`);
    updateMaintenanceItemStatusLocally(itemId, nextStatus);
    removedFromView = !isOpenMaintenanceStatus(nextStatus);
  } catch (error) {
    console.error("Error updating maintenance item status:", error);
    showToast("Failed to update maintenance item status.");
  } finally {
    if (!removedFromView) {
      setMaintenanceItemBusy(itemId, false);
    }
  }
}

async function uploadMaintenancePhoto(event, itemId, type, projectId, estimateId) {
  const files = event.target.files;
  if (!files || files.length === 0) return;

  const vendorId = localStorage.getItem("vendorId");
  if (!vendorId || !projectId || !estimateId) {
    showToast("Missing upload context for this maintenance item.");
    return;
  }

  const formData = new FormData();
  for (const file of files) {
    formData.append("photos", file);
  }

  formData.append("itemId", itemId);
  formData.append("type", type);
  formData.append("estimateId", estimateId);
  formData.append("vendorId", vendorId);

  setMaintenancePhotoBusy(itemId, type, true);

  try {
    const response = await fetch("/api/upload-photos", {
      method: "POST",
      body: formData
    });

    const result = await response.json();
    if (!response.ok) throw new Error(result.message || "Upload failed.");

    showToast(`${files.length} photo(s) uploaded.`);
    if (Array.isArray(result.photoUrls) && result.photoUrls.length > 0) {
      applyMaintenancePhotoUpdate(itemId, type, result.photoUrls);
    } else {
      await refreshMaintenancePhotoSection(projectId, estimateId, itemId, type);
    }
  } catch (error) {
    console.error("Maintenance photo upload error:", error);
    showToast("Failed to upload maintenance photos.");
  } finally {
    setMaintenancePhotoBusy(itemId, type, false);
    event.target.value = "";
  }
}

async function refreshMaintenancePhotoSection(projectId, estimateId, itemId, type) {
  const vendorId = localStorage.getItem("vendorId");
  if (!vendorId) return;

  try {
    const bundle = await fetchProjectAssignmentBundle(vendorId, projectId, { force: true });
    const item = (bundle?.assignedItems || []).find(entry => String(entry.itemId) === String(itemId));
    if (!item) throw new Error("Maintenance item not found after upload.");

    applyMaintenancePhotoUpdate(itemId, type, item.photos?.[type] || []);
  } catch (error) {
    console.error("Error refreshing maintenance photo section:", error);
  }
}

let newStatus = normalizedCurrentStatus;

if (statusCounts.rework > 0) {

} else {

      // 7. Add retry logic for the update

// Update this helper function for status normalization
function normalizeStatus(status) {
  if (!status) return "new";
  
  // Convert to lowercase and handle various formats
  const s = status.toLowerCase().trim();
  
  if (s === "in progress" || s === "inprogress" || s === "in-progress") {
    return "in-progress";
  } else if (s === "completed" || s === "complete" || s === "done" || s === "approved") {
    return "completed";  // ✅ Now treats "approved" as "completed"
  } else if (s === "rework" || s === "needs rework" || s === "fix") {
    return "rework";
  } else if (s === "new" || s === "not started") {
    return "new";
  }
  
  // Default fallback
  return s;
}




// ✅ Mark Project as Completed
async function completeProject(projectId) {
    const vendorId = localStorage.getItem("vendorId");

    try {
        const response = await fetch(`/api/vendors/${vendorId}/assigned-items/${projectId}`);
        if (!response.ok) throw new Error("Failed to fetch assigned items.");

        const data = await response.json();
        const assignedItems = data.items;

        // Check if all assigned items are completed
        const allCompleted = assignedItems.every(item => item.status === 'completed');

        if (!allCompleted) {
            showToast("Cannot mark project as completed. Please ensure all assigned items are completed.", "error");
            return;
        }

        // Mark project as completed
        const completeResponse = await fetch('/api/vendor/update-project-status', {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ vendorId, projectId, status: "completed" }),
        });

        if (!completeResponse.ok) throw new Error("Failed to mark project as completed.");

        showToast("Project marked as completed!", "success");

        // Refresh the page after successful completion
        window.location.reload();
      
    } catch (error) {
        showToast("Error completing project.", "error");
        console.error("Error completing project:", error);
    }
}

async function startJob(projectId) {
  showLoader();
  try {
    const vendorId = localStorage.getItem("vendorId");
    // Fetch all assigned items for this project
    const response = await fetch(`/api/vendors/${vendorId}/assigned-items/${projectId}`);
    if (!response.ok) throw new Error("Failed to fetch assigned items.");
    const data = await response.json();
    const assignedItems = data.items || [];
    if (assignedItems.length === 0) {
      showToast("No line items found for this project.", "error");
      hideLoader();
      return;
    }
    // Only update items with status "new"
    for (const item of assignedItems) {
      const status = (item.status || "").toLowerCase();
      if (status === "new") {
        await fetch(`/api/vendors/${vendorId}/update-item-status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            itemId: item.itemId, 
            status: "in-progress"
          })
        });
      }
    }
    showToast("All new line items set to In Progress!", "success");
    // Optionally, refresh projects
    await fetchAssignedProjects(vendorId);
  } catch (error) {
    showToast("Failed to start job.", "error");
    console.error(error);
  } finally {
    hideLoader();
  }
}
